name: Build and test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: 6.11.2
  ANDROID_NDK_VERSION: r27c
  ANDROID_API: 28

jobs:
  linux:
    name: Linux SRV smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev

      - name: Build and install QJDns
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/sdk" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_QJDNS=ON \
            -DBUILD_JDNS_TOOL=OFF \
            -DJDNS_QT_MAJOR_VERSION=6 \
            -DMULTI_QT=OFF
          cmake --build build --parallel
          cmake --install build

      - name: Build SRV smoke consumer
        shell: bash
        run: |
          set -euo pipefail
          mkdir smoke
          cat > smoke/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.19)
          project(jdns_srv_smoke LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 17)
          find_package(Qt6 REQUIRED COMPONENTS Core Network)
          find_package(QJDns CONFIG REQUIRED)
          add_executable(jdns-srv-smoke main.cpp)
          target_link_libraries(jdns-srv-smoke PRIVATE QJDns::QJDns)
          CMAKE
          cat > smoke/main.cpp <<'CPP'
          #include <qjdns.h>

          #include <QCoreApplication>
          #include <QDebug>
          #include <QTimer>

          int main(int argc, char **argv)
          {
              QCoreApplication app(argc, argv);
              QJDns jdns;
              int exitCode = 1;

              if (!jdns.init(QJDns::Unicast, QHostAddress::Any)) {
                  qCritical() << "Unable to initialize QJDns";
                  return 2;
              }

              const auto systemInfo = QJDns::systemInfo();
              if (systemInfo.nameServers.isEmpty()) {
                  qCritical() << "No system DNS servers detected";
                  return 3;
              }
              jdns.setNameServers(systemInfo.nameServers);

              QObject::connect(&jdns, &QJDns::resultsReady, &app,
                               [&](int, const QJDns::Response &response) {
                                   int srvCount = 0;
                                   for (const auto &record : response.answerRecords) {
                                       if (record.type != QJDns::Srv)
                                           continue;
                                       ++srvCount;
                                       qInfo().noquote()
                                           << "SRV"
                                           << QString::fromLatin1(record.name)
                                           << "port" << record.port
                                           << "priority" << record.priority
                                           << "weight" << record.weight;
                                   }
                                   exitCode = srvCount > 0 ? 0 : 4;
                                   if (!srvCount)
                                       qCritical() << "No SRV records returned";
                                   jdns.shutdown();
                               });

              QObject::connect(&jdns, &QJDns::error, &app,
                               [&](int, QJDns::Error error) {
                                   qCritical() << "QJDns query failed" << error;
                                   exitCode = 5;
                                   jdns.shutdown();
                               });

              QObject::connect(&jdns, &QJDns::shutdownFinished, &app,
                               [&] { app.exit(exitCode); });

              QTimer::singleShot(15000, &app, [&] {
                  qCritical() << "SRV lookup timed out";
                  exitCode = 6;
                  jdns.shutdown();
              });

              jdns.queryStart("_xmpp-client._tcp.psi-im.org", QJDns::Srv);
              return app.exec();
          }
          CPP
          cmake -S smoke -B smoke-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/sdk"
          cmake --build smoke-build --parallel

      - name: Resolve psi-im.org XMPP SRV
        shell: bash
        run: |
          set -euo pipefail
          timeout 20s ./smoke-build/jdns-srv-smoke

  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            qt_arch: android_arm64_v8a
          - abi: x86_64
            qt_arch: android_x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: android
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Configure
        shell: bash
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          qt_cmake=$(find "$QT_ROOT_DIR" -type f -name qt-cmake -print -quit)
          test -n "$qt_cmake"
          chmod +x "$qt_cmake"
          "$qt_cmake" -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$PWD/sdk" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_C_FLAGS='-Wall -Wextra -Wpedantic -Werror -Wno-error=strict-prototypes -Wno-error=unused-function' \
            -DCMAKE_CXX_FLAGS='-Wall -Wextra -Wpedantic -Werror -Wno-error=gnu-zero-variadic-macro-arguments' \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_QJDNS=ON \
            -DBUILD_JDNS_TOOL=OFF \
            -DJDNS_QT_MAJOR_VERSION=6 \
            -DMULTI_QT=OFF

      - name: Build and install
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --parallel
          cmake --install build
          test -f sdk/lib/libjdns.a
          test -f sdk/lib/libqjdns.a
          test -f sdk/lib/cmake/jdns/JDnsConfig.cmake
          test -f sdk/lib/cmake/qjdns/QJDnsConfig.cmake

      - name: Compile installed CMake consumer
        shell: bash
        run: |
          set -euo pipefail
          mkdir consumer
          cat > consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.19)
          project(jdns_consumer LANGUAGES CXX)
          find_package(Qt6 REQUIRED COMPONENTS Core Network)
          find_package(QJDns CONFIG REQUIRED)
          add_library(jdns-consumer SHARED main.cpp)
          target_link_libraries(jdns-consumer PRIVATE QJDns::QJDns)
          CMAKE
          cat > consumer/main.cpp <<'CPP'
          #include <qjdns.h>

          extern "C" int jdns_consumer_smoke()
          {
              QJDns::Record record;
              return record.type;
          }
          CPP
          qt_cmake=$(find "$QT_ROOT_DIR" -type f -name qt-cmake -print -quit)
          "$qt_cmake" -S consumer -B consumer-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            "-DJDns_DIR=$PWD/sdk/lib/cmake/jdns" \
            "-DQJDns_DIR=$PWD/sdk/lib/cmake/qjdns"
          cmake --build consumer-build --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: jdns-qt6-android-${{ matrix.abi }}
          path: sdk/
          if-no-files-found: error
