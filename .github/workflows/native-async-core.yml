name: JDNS native async API
on:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang
      - name: Configure C-only core and tests
        run: >
          cmake -S . -B build -G Ninja
          -D BUILD_QJDNS=OFF
          -D JDNS_BUILD_TESTS=ON
          -D JDNS_ENABLE_INSTALL=OFF
          -D CMAKE_BUILD_TYPE=${{ matrix.build }}
          -D CMAKE_C_COMPILER=${{ matrix.compiler }}
      - name: Build
        run: cmake --build build --parallel 3
      - name: Test
        run: ctest --test-dir build --output-on-failure
