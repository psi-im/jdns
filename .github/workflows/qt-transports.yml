name: QJDns transport build

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: dns-transports-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qt:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        qt: [5, 6]
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qtbase5-dev qt6-base-dev
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -D BUILD_QJDNS=ON
          -D JDNS_BUILD_TESTS=ON
          -D BUILD_JDNS_TOOL=OFF
          -D JDNS_QT_MAJOR_VERSION=${{ matrix.qt }}
          -D JDNS_ENABLE_INSTALL=ON
          -D CMAKE_INSTALL_PREFIX=${{ github.workspace }}/stage
          -D CMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel 3
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Compile README example against the installed package
        run: |
          cmake --install build
          python3 tests/extract_readme_example.py readme-example
          cmake -S readme-example -B readme-example/build -G Ninja \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/stage \
            -DQT_DEFAULT_MAJOR_VERSION=${{ matrix.qt }}
          cmake --build readme-example/build --parallel 3
          python3 tests/check_installed_package.py stage ${{ matrix.qt }}

  windows:
    name: Windows / Qt ${{ matrix.qt }}
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt: '5.15.2'
            major: 5
            arch: win64_msvc2019_64
          - qt: '6.4.3'
            major: 6
            arch: win64_msvc2019_64
          - qt: '6.12.0'
            major: 6
            arch: win64_msvc2022_64
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          arch: ${{ matrix.arch }}
          cache: true
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -D BUILD_QJDNS=ON
          -D JDNS_BUILD_TESTS=ON
          -D BUILD_JDNS_TOOL=OFF
          -D JDNS_QT_MAJOR_VERSION=${{ matrix.major }}
          -D JDNS_ENABLE_INSTALL=OFF
          -D CMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel 3
      - name: Test
        run: ctest --test-dir build --output-on-failure
