name: Android DNS runtime smoke

on:
  workflow_dispatch:
    inputs:
      ref:
        description: JDNS branch, tag, or commit to test
        required: true
        default: master
        type: string
      api_level:
        description: Android API level to run
        required: true
        default: both
        type: choice
        options:
          - both
          - '28'
          - '30'

permissions:
  contents: read

env:
  QT_VERSION: 6.11.2
  ANDROID_NDK_VERSION: r27c
  ANDROID_MIN_API: 28

jobs:
  build:
    name: Build x86_64 smoke APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: android
          arch: android_x86_64
          cache: true

      - name: Build and install QJDns
        shell: bash
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          qt_cmake=$(find "$QT_ROOT_DIR" -type f -name qt-cmake -print -quit)
          test -n "$qt_cmake"
          chmod +x "$qt_cmake"
          "$qt_cmake" -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$PWD/sdk" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DANDROID_PLATFORM="android-${ANDROID_MIN_API}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_QJDNS=ON \
            -DBUILD_JDNS_TOOL=OFF \
            -DJDNS_QT_MAJOR_VERSION=6 \
            -DMULTI_QT=OFF
          cmake --build build --parallel
          cmake --install build

      - name: Build DNS smoke APK
        shell: bash
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          smoke_src="$RUNNER_TEMP/jdns-dns-smoke"
          mkdir -p "$smoke_src"

          cat > "$smoke_src/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.19)
          project(jdns_android_dns_smoke LANGUAGES CXX)

          find_package(Qt6 REQUIRED COMPONENTS Core Gui Network)
          find_package(QJDns CONFIG REQUIRED)

          qt_standard_project_setup()
          qt_add_executable(jdns_dns_smoke main.cpp)
          target_link_libraries(jdns_dns_smoke PRIVATE Qt6::Core Qt6::Gui Qt6::Network QJDns::QJDns)
          set_target_properties(jdns_dns_smoke PROPERTIES
              QT_ANDROID_PACKAGE_NAME org.psiim.jdns.dnssmoke
              QT_ANDROID_MIN_SDK_VERSION 28
          )
          qt_add_android_permission(jdns_dns_smoke NAME android.permission.INTERNET)
          qt_add_android_permission(jdns_dns_smoke NAME android.permission.ACCESS_NETWORK_STATE)
          CMAKE

          cat > "$smoke_src/main.cpp" <<'CPP'
          #include <qjdns.h>

          #include <QDebug>
          #include <QGuiApplication>
          #include <QTimer>

          int main(int argc, char **argv)
          {
              QGuiApplication app(argc, argv);
              QJDns jdns;
              QTimer timeout;
              timeout.setSingleShot(true);

              if (!jdns.init(QJDns::Unicast, QHostAddress::Any)) {
                  qCritical() << "JDNS_DNS_SMOKE_FAIL init";
                  return 2;
              }

              QObject::connect(&jdns, &QJDns::resultsReady, &app,
                               [&](int, const QJDns::Response &response) {
                  bool foundSrv = false;
                  for (const QJDns::Record &record : response.answerRecords) {
                      if (record.type != QJDns::Srv)
                          continue;
                      foundSrv = true;
                      qInfo().noquote() << "JDNS_DNS_SRV"
                                        << QString::fromLatin1(record.name)
                                        << "port=" << record.port
                                        << "priority=" << record.priority
                                        << "weight=" << record.weight;
                  }

                  if (foundSrv) {
                      qInfo() << "JDNS_DNS_SMOKE_OK";
                      QGuiApplication::exit(0);
                  } else {
                      qCritical() << "JDNS_DNS_SMOKE_FAIL no SRV records";
                      QGuiApplication::exit(3);
                  }
              });

              QObject::connect(&jdns, &QJDns::error, &app,
                               [&](int, QJDns::Error error) {
                  qCritical() << "JDNS_DNS_SMOKE_FAIL resolver error" << int(error);
                  QGuiApplication::exit(4);
              });

              QObject::connect(&timeout, &QTimer::timeout, &app, [&] {
                  qCritical() << "JDNS_DNS_SMOKE_FAIL timeout";
                  QGuiApplication::exit(5);
              });

              QTimer::singleShot(0, &app, [&] {
                  qInfo() << "JDNS_DNS_SMOKE_START _xmpp-client._tcp.psi-im.org";
                  timeout.start(30000);
                  jdns.queryStart("_xmpp-client._tcp.psi-im.org", QJDns::Srv);
              });

              return app.exec();
          }
          CPP

          qt_cmake=$(find "$QT_ROOT_DIR" -type f -name qt-cmake -print -quit)
          "$qt_cmake" -S "$smoke_src" -B smoke-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DANDROID_PLATFORM="android-${ANDROID_MIN_API}" \
            "-DJDns_DIR=$PWD/sdk/lib/cmake/jdns" \
            "-DQJDns_DIR=$PWD/sdk/lib/cmake/qjdns"
          cmake --build smoke-build --target jdns_dns_smoke_make_apk --parallel

          apk=$(find smoke-build -type f -name '*.apk' -print -quit)
          test -n "$apk"
          mkdir -p artifact
          cp "$apk" artifact/jdns-dns-smoke.apk
          ls -lh artifact/jdns-dns-smoke.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jdns-dns-smoke-apk
          path: artifact/jdns-dns-smoke.apk
          if-no-files-found: error

  runtime:
    name: Android API ${{ matrix.api_level }} SRV lookup
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api_level: ${{ fromJSON(inputs.api_level == 'both' && '[28,30]' || format('[{0}]', inputs.api_level)) }}
    steps:
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v4
        with:
          name: jdns-dns-smoke-apk
          path: artifact

      - name: Resolve XMPP SRV on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api_level }}
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            apk="artifact/jdns-dns-smoke.apk"
            adb logcat -c
            adb install -r "$apk"
            adb shell monkey -p org.psiim.jdns.dnssmoke -c android.intent.category.LAUNCHER 1 >/dev/null

            i=0
            while [ "$i" -lt 45 ]; do
              logs="$(adb logcat -d -v brief | grep -E 'JDNS_DNS_(SMOKE|SRV)' || true)"
              if echo "$logs" | grep -q 'JDNS_DNS_SMOKE_OK'; then
                echo "$logs"
                exit 0
              fi
              if echo "$logs" | grep -q 'JDNS_DNS_SMOKE_FAIL'; then
                echo "$logs"
                exit 1
              fi
              sleep 1
              i=$((i + 1))
            done

            echo 'Timed out waiting for JDNS DNS smoke marker.'
            adb logcat -d -v brief | tail -n 200
            exit 1
